[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[project]
name = "dbtalk"
version = "0.19.0"
description = "MySQL and PostgreSQL backup/restore plus JSONL database transfer CLI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "asyncmy>=0.2,<1",
  "click>=8.1,<9",
  "dynaconf>=3.3,<4",
  "psycopg[binary]>=3.2,<4",
  "pymysql>=1.1,<2",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6.0,<7",
  "tabulate>=0.9,<1",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7,<8",
  "pyinstaller>=6.11,<7",
  "ruff>=0.9",
  "types-PyMySQL>=1.1.0",
  "types-tabulate>=0.9",
]

[project.scripts]
dbtalk = "dbtalk.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["scripts/install.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires a manually prepared external database or Docker environment",
]

[tool.coverage.run]
branch = true
source = ["dbtalk"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
precision = 1
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
strict = true
warn_unused_configs = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["dynaconf"]
ignore_missing_imports = true
