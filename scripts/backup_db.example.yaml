# Copy this file to backup_db.yaml and fill in the DSNs.
output_directory: ../data
target_validation:
  # Maximum database connection time for each configured connection.
  connection_timeout_seconds: 10

connections:
  - name: example
    dsn: "mysql+pymysql://<user>:<password>@<host>:3306/"
    databases:
      - name: "<database>"
        enabled: false
