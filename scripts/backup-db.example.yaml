# Copy this file to backup-db.yaml and fill in the DSNs.
output_directory: ../data
target_validation:
  # Maximum connection and query time for test and sync, in seconds.
  connection_timeout_seconds: 5

connections:
  - name: example
    enabled: true
    dsn: "mysql+pymysql://<user>:<password>@<host>:3306/"
    databases:
      - name: "<database>"
        enabled: false
        exclude_tables:
          - "<optional_table>"
